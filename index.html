<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D6A4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mealboard">
<title>Mealboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232D6A4C'/%3E%3Cpath d='M18 44V22l14 12 14-12v22' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: app shell. Header with brand + tabs (tabs dock to the bottom on phones), one working view below, recipes as a tile grid, details in a sheet. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --sunk:#E6EAE2; --ink:#18221C; --muted:#58645C; --line:#D5DBD1;
  --accent:#2D6A4C; --accent-ink:#FFFFFF; --accent-soft:#DCEBE1;
  --gold:#C98A12; --gold-soft:#F6E7C4; --danger:#B03A26; --danger-soft:#F6DED8;
  --scrim:rgba(18,26,21,.42); --shadow:0 1px 2px rgba(20,30,24,.06),0 6px 18px rgba(20,30,24,.07);
  --cat-l:40%; --cat-s:48%;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111612; --surface:#1A211C; --sunk:#232C26; --ink:#E8EDE7; --muted:#9AA69D; --line:#2E3931;
  --accent:#74C49A; --accent-ink:#0D1A12; --accent-soft:#1F3328;
  --gold:#E8B54A; --gold-soft:#3A3020; --danger:#EC7A63; --danger-soft:#3D221D;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.35); --cat-l:66%; --cat-s:45%; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111612; --surface:#1A211C; --sunk:#232C26; --ink:#E8EDE7; --muted:#9AA69D; --line:#2E3931;
  --accent:#74C49A; --accent-ink:#0D1A12; --accent-soft:#1F3328;
  --gold:#E8B54A; --gold-soft:#3A3020; --danger:#EC7A63; --danger-soft:#3D221D;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.35); --cat-l:66%; --cat-s:45%; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
.app{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 112px}

/* header + tabs */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px 14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.65rem;font-weight:800;letter-spacing:-.02em}
.brand .wk{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--muted);font-size:.78rem;font-weight:700;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#1b1405;font-size:.7rem;line-height:18px;font-variant-numeric:tabular-nums}
@media (min-width:860px){
  .app{padding-block:0 48px}
  .tabs{position:static;display:flex;gap:4px;background:var(--sunk);border:0;padding:4px;border-radius:12px}
  .tab{flex-direction:row;gap:8px;padding:8px 14px;font-size:.92rem}
  .tab svg{width:18px;height:18px}
  .tab .badge{position:static}
}

/* generic */
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.spread{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-block:8px 18px}
.view-head h2{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800;letter-spacing:-.02em}
.view-head p{margin:4px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.95rem}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.small{min-height:36px;padding:6px 12px;font-size:.88rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:700;font-size:.9rem}
.hint{font-size:.85rem;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=password],select,textarea{
  width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:96px;resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.stepper button{width:44px;height:44px;border:0;background:none;font-size:1.3rem;font-weight:700;color:var(--accent)}
.stepper button:disabled{color:var(--line);cursor:not-allowed}
.stepper output{min-width:42px;text-align:center;font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.catdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:hsl(var(--h,140) var(--cat-s) var(--cat-l));flex:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.busy{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);font-weight:700}
.busy small{display:block;font-weight:400;color:var(--muted)}
.empty{text-align:center;padding:40px 20px;border:1.5px dashed var(--line);border-radius:var(--r)}
.empty h3{font-size:1.3rem;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:42ch}

/* generate */
.gen{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:900px){.gen{grid-template-columns:340px minmax(0,1fr);align-items:start}.gen .settings{position:sticky;top:12px}}
details.settings>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.settings>summary::-webkit-details-marker{display:none}
details.settings>summary h3{font-size:1.15rem}
details.settings[open]>summary{margin-bottom:16px}
.sumline{font-size:.88rem;color:var(--muted)}
.progress{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:14px;height:14px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.pip.on{background:var(--accent);border-color:var(--accent)}
.cands{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.cand{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.cand.picked{border:2px solid var(--accent);background:var(--accent-soft);padding:15px}
.cand h3{font-size:1.18rem;font-weight:700}
.cand p{margin:0;color:var(--muted);font-size:.95rem}
.cand .ings{font-size:.85rem;color:var(--muted)}
.cand .acts{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:auto;padding-top:6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .cost{color:var(--gold);font-weight:700;letter-spacing:.05em}
.buildbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;margin-top:16px}
@media (min-width:860px){.buildbar{bottom:16px}}

/* tiles */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.tile-open{display:flex;flex-direction:column;gap:8px;width:100%;height:100%;text-align:left;border:0;background:none;padding:16px 16px 14px;border-radius:var(--r)}
.tile-open:hover{background:var(--sunk)}
.tile h3{font-size:1.22rem;font-weight:700;padding-right:40px}
.tile .eyebrow{display:flex;align-items:center;gap:7px;padding-right:40px}
.tile .meta{margin-top:auto}
.tile-check{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent}
.tile-check svg{width:18px;height:18px}
.tile-check:hover{border-color:var(--accent);color:var(--accent)}
.tile.done .tile-check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.done h3{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.tile.done{background:var(--sunk)}
.stars-mini{display:inline-flex;gap:1px;color:var(--gold)}
.stars-mini svg{width:14px;height:14px}
.fav{color:var(--danger);display:inline-flex}
.fav svg{width:16px;height:16px}
.sectionlabel{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sectionlabel h3{font-size:1.05rem}
.sectionlabel hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}

/* shopping */
.shop{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));align-items:start}
.aisle h3{font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.aisle h3 span{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:400}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.item input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.item .nm{font-weight:700}
.item .for{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.item .qty{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:.92rem}
.item.got .nm,.item.got .qty{text-decoration:line-through;color:var(--muted)}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:2px}
.notice{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:var(--r);background:var(--gold-soft);margin-bottom:16px}

/* recipe box */
.boxbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.boxbar input{max-width:280px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.scrim{align-items:center;padding:24px}.sheet{border-radius:18px;max-height:90vh;padding:26px 28px}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.sheet-head h2{font-size:clamp(1.5rem,4vw,2rem);font-weight:800;letter-spacing:-.015em}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;padding:4px;color:var(--line)}
.stars button.on{color:var(--gold)}
.stars svg{width:30px;height:30px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;color:var(--muted)}
.toggle svg{width:17px;height:17px}
.toggle[aria-pressed="true"]{color:var(--ink);background:var(--accent-soft);border-color:var(--accent)}
.toggle.fav-t[aria-pressed="true"]{background:var(--danger-soft);border-color:var(--danger)}
.toggle.fav-t[aria-pressed="true"] svg{color:var(--danger)}
.recipe-cols{display:grid;gap:22px;grid-template-columns:1fr;margin-top:18px}
@media (min-width:760px){.recipe-cols{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}}
.recipe-cols h3{font-size:1.1rem;margin-bottom:8px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing b{font-variant-numeric:tabular-nums;min-width:4.5em;flex:none}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:8px 0;max-width:65ch}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:1.15rem;line-height:1.35}
.tipbox{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--gold-soft);font-size:.95rem}
.photo-drop{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px;border:1.5px dashed var(--line);border-radius:var(--r)}
.photo-drop img{width:72px;height:72px;object-fit:cover;border-radius:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:700;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (min-width:860px){.toast{bottom:24px}}
.loading{display:flex;align-items:center;gap:12px;justify-content:center;padding:80px 0;color:var(--muted)}
.engine{font-size:.85rem;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--sunk)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<style>
/* additions for the standalone build */
html,body{margin:0}
body{-webkit-text-size-adjust:100%}
.app{padding-top:env(safe-area-inset-top,0px)}
.top-right{display:flex;align-items:center;gap:10px}
.brand .wk{white-space:nowrap}
.acct{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;color:var(--muted);white-space:nowrap}
.acct .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.78rem}
.acct.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.acct .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.controls{display:flex;flex-direction:column;gap:16px}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;min-height:48px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .t{font-weight:700}
details.fold>summary .s{display:block;font-size:.85rem;color:var(--muted);font-weight:400}
details.fold>summary .chev{width:18px;height:18px;transition:transform .15s;color:var(--muted);flex:none}
details.fold[open]>summary .chev{transform:rotate(180deg)}
details.fold>.inner{display:flex;flex-direction:column;gap:16px;padding:4px 12px 14px}
@media (prefers-reduced-motion:reduce){details.fold>summary .chev{transition:none}}
.reqrow input{min-height:46px}
.genbtn{width:100%}
.fullnote{font-size:.88rem;color:var(--muted);margin:0 0 12px}
.warnbox{padding:12px 14px;border-radius:10px;background:var(--gold-soft);font-size:.92rem}
.okline{font-size:.88rem;color:var(--muted)}
code{font-size:.85em;background:var(--sunk);padding:1px 5px;border-radius:5px}
.favbadge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--danger-soft);color:var(--danger);letter-spacing:.04em}
.favbadge svg{width:12px;height:12px}
.shares,.left{display:inline-flex;align-items:center;gap:5px;font-size:.84rem;color:var(--accent);font-weight:700}
.shares svg,.left svg{width:15px;height:15px;flex:none}
.left{display:flex;font-weight:400;margin-top:2px;color:var(--gold)}
.useup{margin-bottom:16px;background:var(--accent-soft);border-color:transparent}
.useup h3{display:flex;align-items:center;gap:8px;font-size:1.1rem;margin-bottom:6px}
.useup h3 svg{width:20px;height:20px;color:var(--accent)}
.useup ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:70ch}
/* header: never wider than the phone */
.app{overflow-x:clip}
.top{flex-wrap:nowrap;min-width:0}
.brand{min-width:0;flex-wrap:wrap;row-gap:0}
.top-right{flex:none}
.gear{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.gear svg{width:21px;height:21px}
.gear:hover{color:var(--ink)}
.gdot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.gdot.warn{background:var(--gold)}
@media (max-width:420px){.brand h1{font-size:1.45rem}.brand .wk{font-size:.72rem}}
/* settings sheet */
.setsec{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.setsec:first-child{border-top:0;padding-top:0}
.setsec h3{font-size:1.1rem}
.setsec .hint{margin:0}
code.code{word-break:break-all}
.joinrow{display:flex;gap:8px;min-width:0}
.joinrow input{min-width:0;flex:1}
/* tiles */
.tile.nocheck h3,.tile.nocheck .eyebrow{padding-right:0}
.writing{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--accent);font-weight:700}
.writing .spin{width:14px;height:14px;border-width:2px}
.writing.failed{color:var(--danger)}
.btn .spin{width:14px;height:14px;border-width:2px}
/* photos */
.photo-drop{flex-direction:column;align-items:flex-start}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative}
.thumb img{width:76px;height:76px;object-fit:cover;border-radius:8px;display:block}
.thumb button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink)}
.thumb button svg{width:13px;height:13px}
/* shopping */
.addbox{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.addbox textarea{min-height:64px}
.item{grid-template-columns:28px minmax(0,1fr) auto auto;cursor:default}
.item .nm{cursor:pointer;min-width:0;overflow-wrap:anywhere}
.rmx{width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center;padding:0;margin-top:-3px}
.rmx svg{width:15px;height:15px}
.rmx:hover{color:var(--danger);background:var(--danger-soft)}
.notice{margin-bottom:16px}

async function openHousehold(hid, { upload = false } = {}){
  const { F, db } = store.fb;

  if (store.unsubHouse) { store.unsubHouse(); store.unsubHouse = null; }
  store.pending.clear();
  store.hid = hid; store.mode = "cloud";
  const col = F.collection(db, "households", hid, "items");
  if (upload) persistAll();
  else {
    const snap = await F.getDocs(col);
    resetState(); snap.docs.forEach(d => applyDoc(d.id, d.data()));

  }
  store.unsub = F.onSnapshot(col, s => {

/* ---------- Gemini ---------- */
const gemKey = () => lsGet(LS_GEM) || "";
const gemModel = () => { const m = (lsGet(LS_MODEL) || "").trim(); return !m || m === "gemini-2.5-flash" || !/^gemini-[\w.-]+$/.test(m) ? "auto" : m; };
function fileToB64(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(f); }); }
function parseLooseJSON(t){
  try { return JSON.parse(t); } catch {}
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (m) { try { return JSON.parse(m[1]); } catch {} }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("]"), t.lastIndexOf("}"));
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
  throw { code: "invalid_json" };
}
/* Models tried in order when "Automatic" is chosen. If one is overloaded,
   rate limited or unavailable to your project, the next one is used. */
const MODEL_CHAIN = ["gemini-3.8-flash","gemini-3.7-flash","gemini-3.6-flash","gemini-3.5-flash","gemini-3.5-flash-lite","gemini-3.1-flash-lite","gemini-3-flash-preview"];
let lastModel = "", modelList = null, modelBad = {};
const FAST_FIRST = ["gemini-3.5-flash-lite","gemini-3.1-flash-lite"];
const noThink = {};
function modelOrder(fast = false){
  const m = gemModel();
  const list = m === "auto" ? (fast ? FAST_FIRST.filter(x => !modelList || !modelList.length || modelList.includes(x)) : []) : [m];
  for (const x of (modelList && modelList.length ? [...MODEL_CHAIN.filter(c => modelList.includes(c)), ...MODEL_CHAIN.filter(c => !modelList.includes(c))] : MODEL_CHAIN)) if (!list.includes(x)) list.push(x);
  // models that failed recently go to the back of the line for 5 minutes
  const now = Date.now();
  return [...list.filter(x => !(modelBad[x] > now)), ...list.filter(x => modelBad[x] > now)];
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function callModel(model, body){
  let res;
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": gemKey() }, body
    });
  } catch { throw { code: "network", fatal: true }; }
  let j = null; try { j = await res.json(); } catch {}
  if (!res.ok) {
    const msg = j && j.error && j.error.message || "";
    if (/api key/i.test(msg) || res.status === 401) throw { code: "bad_key", message: msg, fatal: true };
    if (res.status === 429) throw { code: "rate", message: msg };
    if (res.status === 503 || res.status === 500 || /overloaded|high demand|unavailable/i.test(msg)) throw { code: "busy", message: msg };
    if (res.status === 400 && /thinking/i.test(msg)) throw { code: "bad_param", message: msg };
    if (res.status === 404 || res.status === 403 || /model|not found|not supported|no longer available/i.test(msg)) throw { code: "bad_model", message: msg };
    throw { code: "upstream", message: msg || ("HTTP " + res.status) };
  }
  const cand = j && j.candidates && j.candidates[0];
  const t = cand ? ((cand.content && cand.content.parts) || []).map(p => p.text || "").join("") : "";
  if (!t) throw { code: "blocked", fatal: true };
  return t;
}
/* fast: short, low-stakes answers (meal ideas). Asks Gemini to think less and tries the quick Lite models first. */
async function askJSON(prompt, { images = null, fast = false } = {}){
  if (!gemKey()) throw { code: "no_key" };
  const parts = [{ text: prompt }];
  if (images) for (const f of [].concat(images)) parts.push({ inline_data: { mime_type: f.type || "image/jpeg", data: await fileToB64(f) } });
  const mk = think => JSON.stringify({ contents: [{ role: "user", parts }], generationConfig: { responseMimeType: "application/json", temperature: 0.9, ...(think ? { thinkingConfig: { thinkingLevel: "low" } } : {}) } });
  let lastErr = null;
  for (const model of modelOrder(fast)) {
    for (let attempt = 0; attempt < 3; attempt++) {
      const think = fast && !noThink[model];
      try {
        const t = await callModel(model, mk(think));
        let out; try { out = parseLooseJSON(t); } catch (e) { if (attempt === 0) continue; throw e; }
        lastModel = model; delete modelBad[model];
        const el = document.getElementById("lastModel"); if (el) el.textContent = "Last answer came from " + model + ".";
        return out;
      } catch (e) {
        lastErr = e;
        if (e.fatal) throw e;
        if (e.code === "bad_param") { if (think) { noThink[model] = true; continue; } break; }
        if (e.code === "invalid_json") break;
        if (e.code === "bad_model") { modelBad[model] = Date.now() + 30 * 60e3; break; }
        if (e.code === "busy" && attempt === 0) { await sleep(1200); continue; }
        modelBad[model] = Date.now() + 5 * 60e3; break; // busy twice, or rate limited: try the next model
      }
    }
  }
  throw lastErr && lastErr.code === "bad_model" ? { code: "no_model", message: lastErr.message } : (lastErr || { code: "upstream" });
}
async function loadModels(){
  if (!gemKey()) return;
  try {
    const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers: { "x-goog-api-key": gemKey() } });
    if (!res.ok) return;
    const j = await res.json();
    modelList = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map(m => String(m.name || "").replace(/^models\//, ""))
      .filter(n => /^gemini-/.test(n) && !/tts|image|live|audio|embedding|transcribe|robotics|computer/.test(n))
      .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
    if (S.view === "generate" && !isEditing()) render();
  } catch {}
}
function aiErr(e){
  const c = e && e.code;
  const base = ({
    no_key: "Add your Gemini API key in Settings (gear button, top right) so the app can write meals.",
    bad_key: "Gemini rejected the API key. Check it in Settings (gear button, top right).",
    no_model: "None of the Gemini models are available to your API key. Check the key's project in Google AI Studio." + (e && e.message ? " (" + e.message + ")" : ""),
    rate: "You've hit Gemini's free-tier limit on every model. Wait a minute, then try again.",
    busy: "Gemini is overloaded on every model right now. Wait a minute, then try again.",
    invalid_json: "Gemini's answer came back garbled. Try again.",
    blocked: "Gemini didn't return an answer. Try rewording your special requests.",
    network: "Couldn't reach Gemini. Check your connection.",
    upstream: "Gemini had a problem" + (e && e.message ? ": " + e.message : ". Try again.")

}

function weekContext(){

/* Favorites to mix into a new list: right meal type, not already planned or listed, least recently made first. */
function favoriteCandidates(k){
  if (k <= 0) return [];
  const s = S.settings, listed = new Set(S.plan.candidates.map(c => c.favId).filter(Boolean));
  const rej = new Set(S.plan.rejected.map(x => x.toLowerCase()));
  const pool = recipesArr().filter(r => r.favorite && !r.inPlan && !r.pending && !listed.has(r.id) && s.mealTypes.includes(r.mealType) && !rej.has(r.name.toLowerCase()) && r.ingredients && r.ingredients.length)
    .map(r => [r, (r.doneAt || r.addedAt || r.createdAt || 0) + Math.random() * 864e5])
    .sort((a, b) => a[1] - b[1]).slice(0, k).map(x => x[0]);
  return pool.map(r => ({
    id: uid(), status: "open", favId: r.id, name: r.name, description: r.description || "One of your favorites.",

    totalMinutes: num(r.totalMinutes) ?? (((r.prepMinutes || 0) + (r.cookMinutes || 0)) || null),

const BATCH_LEAN = ["chicken, turkey, vegetarian and seafood mains", "beef, pork, pasta, soups and grain bowls"];
async function fetchIdeas(n, exclude, { batch = 0, of = 1 } = {}){
  const s = S.settings, p = prefsText();
  const favs = recipesArr().filter(r => r.favorite).map(r => r.name).slice(0, 15);
  const week = weekContext(), lw = lowWaste();
  const prompt =
`You are planning home-cooked meals for a household of ${s.people} people.
Suggest exactly ${n} different meal ideas. Meal types to cover: ${typesText()}${s.mealTypes.length > 1 ? " (spread them roughly evenly)" : ""}.
Household preferences: ${p.opts}.
Special requests (follow strictly; treat any allergy as a hard rule and avoid cross-contact ingredients): ${p.req}.
${favs.length ? "Meals this household rated highly (taste reference only, do not repeat them): " + favs.join("; ") + ".\n" : ""}${exclude.length ? "Do not suggest any of these or close variations: " + exclude.join("; ") + ".\n" : ""}${week.length ? "Meals already chosen or on the list for this week: " + week.join("; ") + ".\n" : ""}${lw ? "Food waste matters to this household: favor ideas that reuse perishable ingredients from the meals above and from each other (the same fresh herbs, vegetables, dairy or protein), so nothing is bought for a single use and left to spoil.\n" : ""}${of > 1 ? `This is batch ${batch} of ${of} requested at the same time. To avoid overlap with the other batch, lean toward ${BATCH_LEAN[(batch - 1) % 2]}, unless the special requests say otherwise.\n` : ""}Vary proteins, cuisines and cooking methods.

{"name":"Sheet-Pan Lemon Herb Chicken","description":"One appetizing sentence.","mealType":"dinner","category":"Chicken","cuisine":"Mediterranean","totalMinutes":40,"cost":"$","keyIngredients":["chicken thighs","baby potatoes","lemon"]${lw ? ',"sharesWith":["lemon","parsley"]' : ""}}${lw ? "\nsharesWith lists the perishable ingredients this idea shares with the meals above or with other ideas in your list (empty if none)." : ""}

/* Adds exactly n new ideas when possible (asks again once if Gemini repeats itself). */
async function suggest(n, { fresh = false, withFavorites = false } = {}){
  if (S.busy) return;
  if (!gemKey()) { openSettings(); toast(aiErr({ code: "no_key" })); return; }
  S.busy = { kind: "suggest", label: `Finding ${n} meal ideas`, sub: "This usually takes a few seconds." }; render();
  try {
    if (fresh) { S.plan.rejected = [...S.plan.rejected, ...S.plan.candidates.filter(c => c.status !== "picked" && !c.favId && !c.pickedAt).map(c => c.name)].slice(-200); S.plan.candidates = picked(); }
    const favs = withFavorites ? favoriteCandidates(Math.min(S.settings.favorites ?? 1, n - 1)) : [];
    S.plan.candidates = [...S.plan.candidates, ...favs];
    n -= favs.length;
    const keep = S.plan.candidates;
    const exclude = () => [...new Set([...S.plan.candidates.map(c => c.name), ...S.plan.rejected, ...planRecipes().map(r => r.name)])].slice(-150);
    const seen = new Set(exclude().map(x => x.toLowerCase()));
    const added = [];
    for (let attempt = 0; attempt < 2 && added.length < n; attempt++) {
      const want = n - added.length;
      const ex = [...exclude(), ...added.map(a => a.name)];
      // 6 or more ideas: ask for two halves at once, which comes back about twice as fast
      const sizes = want >= 6 ? [Math.ceil(want / 2) + 1, Math.floor(want / 2) + 1] : [want + (attempt ? 2 : 1)];
      const res = await Promise.allSettled(sizes.map((k, i) => fetchIdeas(k, ex, { batch: i + 1, of: sizes.length })));
      if (res.every(r => r.status === "rejected")) throw res[0].reason;
      const got = res.flatMap(r => r.status === "fulfilled" ? r.value : []);
      for (const m of got) {
        const k = String(m.name).toLowerCase().trim();
        if (seen.has(k) || added.length >= n) continue;
        seen.add(k); added.push(normCand(m));
      }
    }
    S.plan.candidates = [...keep, ...added];
    syncCandidates();
    if (!added.length && n > 0) toast("No new ideas came back. Try again or loosen your requests.");
    else if (added.length < n) toast(`Only ${added.length} new ideas came back.`);

  } catch (e) { console.error(e); toast(aiErr(e)); }
  S.busy = null; render();
}

function normRecipe(o, c){

}
async function writeRecipes(group, week = []){
  const s = S.settings, p = prefsText(), lw = lowWaste();
  const others = week.filter(w => !group.some(g => w.startsWith(g.name)));
  const prompt =
`Write complete, reliable home recipes for the meals below. Each recipe must serve ${s.people} people.

Special requests (follow strictly; allergies are hard rules): ${p.req}.
Meals:
${group.map((c, i) => `${i + 1}. ${c.name}: ${c.description} (${c.mealType}, ${c.category})`).join("\n")}
${others.length ? "These will be cooked in the same week as: " + others.join("; ") + ".\n" : ""}${lw ? "Minimize food waste across the week: where it fits naturally, use the same perishable ingredients as the other meals (the same fresh herb, vegetable, cheese or package of tortillas) and size amounts so whole packages get used (a whole bunch, a whole can, a whole bell pepper) instead of leaving small remainders. In tips, say how to use any remainder.\n" : ""}Reply with only a JSON array with one object per meal, in the same order, shaped like:

/* Fill a placeholder recipe with what Gemini wrote, keeping its id and plan status. */
function fillRecipe(r, o){
  const n = normRecipe(o, r);
  Object.assign(r, { name: n.name, servings: n.servings, prepMinutes: n.prepMinutes, cookMinutes: n.cookMinutes, ingredients: n.ingredients, steps: n.steps, tips: n.tips, pending: false, writeFailed: false });
  delete r.pendingSince;

function newPlaceholder(c){
  return { id: uid(), name: c.name, description: c.description || "", mealType: c.mealType, category: c.category, cuisine: c.cuisine || "", cost: c.cost || "",
    totalMinutes: c.totalMinutes ?? null, servings: S.settings.people, prepMinutes: null, cookMinutes: null, ingredients: [], steps: [], tips: "",
    keyIngredients: c.keyIngredients || [], source: "ai", rating: 0, favorite: false, done: false, inPlan: true,
    pending: true, pendingSince: Date.now(), addedAt: Date.now(), createdAt: Date.now() };

const writer = { timer: null, inFlight: new Set(), workers: 0 };
function queueWrites(delay = 900){ clearTimeout(writer.timer); writer.timer = setTimeout(runWrites, delay); }
function weekList(){ return planRecipes().map(r => r.name + ((r.keyIngredients && r.keyIngredients.length) ? " (" + r.keyIngredients.join(", ") + ")" : r.ingredients.length ? " (" + r.ingredients.slice(0, 6).map(i => i.item).join(", ") + ")" : "")); }
async function runWrites(){
  if (!gemKey()) return;
  while (writer.workers < 2) {
    const todo = recipesArr().filter(r => r.pending && r.inPlan && !writer.inFlight.has(r.id));
    if (!todo.length) return;
    const group = todo.slice(0, 2);
    group.forEach(r => writer.inFlight.add(r.id));
    writer.workers++;
    (async () => {
      try {
        const out = await writeRecipes(group, weekList());
        out.forEach((o, i) => {
          const r = S.recipes[group[i].id];
          if (!r || !r.pending) return;                       // unpicked while writing
          if (o) fillRecipe(r, o); else { r.pending = false; r.writeFailed = true; }
          saveRecipe(r);
        });
      } catch (e) {
        console.error(e);
        group.forEach(g => { const r = S.recipes[g.id]; if (r && r.pending) { r.pending = false; r.writeFailed = true; saveRecipe(r); } });
        toast(aiErr(e));
      } finally {
        group.forEach(r => writer.inFlight.delete(r.id));
        writer.workers--;
        if (!isEditing()) render();
        runWrites();
      }
    })();
  }
}

  if (stale.length) queueWrites(300);
}

  if (!gemKey() && !(c.favId && S.recipes[c.favId])) { openSettings(); toast(aiErr({ code: "no_key" })); return; }
  let r = c.favId && S.recipes[c.favId];
  if (r) { r.inPlan = true; r.done = false; r.addedAt = Date.now(); }
  else { r = newPlaceholder(c); queueWrites(); }
  saveRecipe(r);
  c.status = "picked"; c.recipeId = r.id; c.pickedAt = Date.now();
  persist("plan");
}
function unpickCandidate(c){
  const r = S.recipes[c.recipeId];
  if (r) {
    if (!c.favId && r.source === "ai" && !r.favorite && !r.rating) { delete S.recipes[r.id]; persist("r-" + r.id); }
    else { r.inPlan = false; saveRecipe(r); }
  }
  c.status = "open"; delete c.recipeId;

}
/* Keep suggestion cards in step when a meal leaves the plan some other way. */
function syncCandidates(){
  let changed = false;
  for (const c of S.plan.candidates) {
    const fr = c.favId && S.recipes[c.favId];
    if (fr && fr.inPlan && c.status !== "picked") { c.status = "picked"; c.recipeId = fr.id; c.pickedAt = Date.now(); changed = true; continue; }
    if (c.status !== "picked") continue;
    const r = S.recipes[c.recipeId];
    // a just-picked meal's recipe may still be on its way from another device
    const gone = !c.recipeId || (!r && Date.now() - (c.pickedAt || 0) > 30e3) || (r && !r.inPlan);
    if (gone) { c.status = "open"; delete c.recipeId; c.drop = !!(r && r.doneAt); changed = true; }
  }
  // meals that were made and cleared leave the idea list
  if (S.plan.candidates.some(c => c.drop)) { S.plan.candidates = S.plan.candidates.filter(c => !c.drop); changed = true; }
  if (changed) persist("plan");
}
/* One-time: recipes the household typed or uploaded count as favorites. */
function migrateOnce(){
  if (S.settings.favMigrated) return;
  recipesArr().filter(r => r.source !== "ai" && !r.favorite).forEach(r => { r.favorite = true; saveRecipe(r); });
  S.settings.favMigrated = true; persist("settings");
}
async function buildPlan(){
  if (S.busy) return;
  const all = picked();
  if (!all.length) return;
  let done = 0, failed = 0, firstErr = null, gi = 0;
  // favorites already have a recipe: put them straight into the plan
  for (const c of all.filter(c => c.favId)) {
    const r = S.recipes[c.favId];
    if (r) { r.inPlan = true; r.done = false; r.addedAt = Date.now(); saveRecipe(r); S.plan.candidates = S.plan.candidates.filter(x => x.id !== c.id); done++; }
  }
  const list = all.filter(c => !c.favId || !S.recipes[c.favId]);
  const week = [...all.map(c => c.name + (c.keyIngredients.length ? " (" + c.keyIngredients.join(", ") + ")" : "")), ...openMeals().filter(r => !all.some(c => c.favId === r.id)).map(r => r.name)];
  const groups = []; for (let i = 0; i < list.length; i += 2) groups.push(list.slice(i, i + 2));
  const tick = () => { S.busy = { kind: "build", label: `Writing recipes (${done} of ${all.length})`, sub: "Full recipes take up to a minute. Keep this page open." }; render(); };
  tick();
  async function worker(){
    while (gi < groups.length){
      const g = groups[gi++];
      try {
        const out = await writeRecipes(g, week);
        out.forEach((r, i) => {
          if (r){ saveRecipe(r); S.plan.candidates = S.plan.candidates.filter(c => c.id !== g[i].id); done++; }
          else failed++;
        });
      } catch (e) { console.error(e); failed += g.length; firstErr = firstErr || e; }
      persist("plan"); tick();
    }
  }
  await Promise.all([worker(), worker()]);
  if (!failed) { S.plan.candidates = []; S.plan.rejected = []; persist("plan"); }
  S.busy = null;
  if (failed) toast(firstErr ? aiErr(firstErr) : `${failed} recipe${failed > 1 ? "s" : ""} didn't come back. Tap Build again for the rest.`);
  if (done) { await buildShopping(); S.view = "plan"; window.scrollTo(0, 0); if (!failed) toast("Your meals and shopping list are ready."); }
  render();
}

const shopIds = () => openMeals().map(r => r.id).sort().join(",");
function localShopping(recipes){
  const m = new Map();
  recipes.forEach(r => r.ingredients.forEach(i => {
    const k = i.item.toLowerCase().trim(); const e = m.get(k) || { item: i.item, q: [], meals: new Set() };
    const a = ingAmount(i); if (a) e.q.push(a); e.meals.add(r.name); m.set(k, e);
  }));
  return [...m.values()].map(e => ({ section: "Other", item: e.item, quantity: e.q.join(" + "), meals: [...e.meals], pantry: false, got: false }));
}
async function buildShopping(){
  const recipes = openMeals();

  S.busy = { kind: "shop", label: "Building your shopping list", sub: "Combining ingredients across meals." }; render();
  const prompt =
`Make one combined grocery shopping list for these recipes. Add up the same ingredient across recipes and turn amounts into what a shopper buys (for example "2 lb", "1 bunch", "1 (14 oz) can", "3 medium").
${recipes.map(r => "## " + r.name + "\n" + r.ingredients.map(i => "- " + ingText(i)).join("\n")).join("\n\n")}

${lowWaste() ? `Buy the smallest amounts that cover the recipes, in sizes stores actually sell.
Reply with only a JSON object shaped like:
{"items":[{"section":"Produce","item":"Fresh cilantro","quantity":"1 bunch","meals":["Exact recipe name"],"pantry":false,"leftover":"about 1/2 bunch"}],"useItUp":["Stir the leftover cilantro into Thursday's rice or freeze it chopped in oil."]}
leftover is what will remain after cooking every recipe, only for perishable items (fresh produce, herbs, dairy, meat, bread, opened cans); use "" when little or nothing is left. useItUp has up to 4 short, practical ideas for using those leftovers.` : `Reply with only a JSON array of objects shaped like:
{"section":"Produce","item":"Yellow onions","quantity":"3 medium","meals":["Exact recipe name"],"pantry":false}`}
section is one of: ${SECTIONS.join(", ")}. Set pantry to true for staples most kitchens already have (salt, pepper, cooking oil, flour, sugar, common dried spices).`;
  let items, useItUp = [];
  try {
    const out = await askJSON(prompt);
    let arr = Array.isArray(out) ? out : (out && out.items) || [];
    if (out && Array.isArray(out.useItUp)) useItUp = out.useItUp.map(String).filter(Boolean).slice(0, 4);
    items = arr.filter(x => x && x.item).map(x => ({ section: SECTIONS.includes(x.section) ? x.section : "Other", item: String(x.item), quantity: String(x.quantity || ""),
      meals: Array.isArray(x.meals) ? x.meals.map(String) : [], pantry: !!x.pantry, got: false, leftover: String(x.leftover || "").trim() }));
    if (!items.length) throw { code: "invalid_json" };
  } catch (e) {
    console.error(e);
    items = localShopping(recipes);
    toast("Couldn't sort the list by aisle, so here's a plain combined list.");

  S.plan.shopping = { items, useItUp, builtFor: shopIds(), at: Date.now() }; persist("shopping");

const SECTION_WORDS = [
  ["Produce", /\b(apple|banana|berr|lettuce|spinach|kale|onion|garlic|potato|tomato|pepper|carrot|celery|cucumber|avocado|lemon|lime|orange|grape|melon|broccoli|cauliflower|zucchini|squash|mushroom|cilantro|parsley|basil|herb|ginger|scallion|salad|fruit|veg|cabbage|corn on)/i],
  ["Meat & Seafood", /\b(chicken|beef|pork|steak|ground|turkey|bacon|sausage|ham|salmon|shrimp|fish|tuna|cod|tilapia|lamb|ribs?)\b/i],
  ["Dairy & Eggs", /\b(milk|cheese|butter|yogurt|yoghurt|cream|eggs?|sour cream|half and half|creamer)\b/i],
  ["Bakery", /\b(bread|bun|bagel|tortilla|roll|muffin|croissant|pita|naan)s?\b/i],
  ["Frozen", /\b(frozen|ice cream|popsicle)\b/i],
  ["Spices & Condiments", /\b(salt|pepper flakes|spice|seasoning|ketchup|mustard|mayo|sauce|vinegar|dressing|cumin|paprika|oregano|cinnamon|syrup|honey)\b/i],
  ["Pantry", /\b(rice|pasta|noodle|flour|sugar|oil|beans|can|canned|cereal|oats|broth|stock|coffee|tea|chips|crackers|snack|peanut butter|jam|nuts)\b/i]
];
const guessSection = name => (SECTION_WORDS.find(([, re]) => re.test(name)) || ["Other"])[0];
function parsePasted(text){
  let lines = String(text || "").split(/\r?\n/);
  if (lines.filter(l => l.trim()).length === 1 && lines.join("").includes(",")) lines = lines.join("").split(",");
  const out = [], seen = new Set(S.extras.map(x => x.item.toLowerCase()));
  for (let l of lines) {
    l = l.replace(/^[\s\-–—•*·◦▪▫●○☐☑✓✔✗□■>]+/, "").replace(/^\d+[.)]\s+/, "").replace(/\s+/g, " ").trim();
    if (!l || l.length > 120) continue;
    if (/^(shopping( list)?|to-?do( list)?|completed( items)?|items?|list|uncheck(ed)?|checked)$/i.test(l)) continue;
    const k = l.toLowerCase(); if (seen.has(k)) continue; seen.add(k);
    out.push(l);
  }
  return out;
}
async function addExtras(text){
  const names = parsePasted(text);
  if (!names.length) { toast("Nothing to add. Paste or type items, one per line."); return 0; }
  const added = names.map(n => ({ id: uid(), item: n, quantity: "", section: guessSection(n), got: false, added: true }));
  S.extras = [...S.extras, ...added]; persist("extras"); render();
  toast(`Added ${added.length} item${added.length > 1 ? "s" : ""} to the list.`);
  if (!gemKey()) return added.length;
  // tidy names, pull out quantities and sort into store sections in the background
  try {
    const out = await askJSON(`Sort these grocery list items into store sections and split out any quantity.
${added.map((x, i) => `${i + 1}. ${x.item}`).join("\n")}
Reply with only a JSON array with one object per item, in the same order, shaped like:
{"item":"Bananas","quantity":"1 bunch","section":"Produce"}
Keep the item's meaning; fix only capitalization and obvious typos. quantity is "" when none was given. section is one of: ${SECTIONS.join(", ")}.`, { fast: true });
    if (Array.isArray(out)) {
      added.forEach((x, i) => {
        const o = out[i]; const cur = S.extras.find(e => e.id === x.id);
        if (!o || !cur) return;
        if (o.item) cur.item = String(o.item).slice(0, 120);
        cur.quantity = String(o.quantity || "");
        if (SECTIONS.includes(o.section)) cur.section = o.section;
      });
      persist("extras"); if (S.view === "shopping" && !isEditing()) render();
    }
  } catch (e) { console.error(e); }
  return added.length;
}

function parseIngLine(line){
  const m = line.match(/^\s*([\d\s\/.½¼¾⅓⅔⅛-]+)?\s*(cups?|tbsp|tablespoons?|tsp|teaspoons?|lbs?|pounds?|oz|ounces?|g|grams?|kg|ml|l|cans?|cloves?|pinch|dash)?\.?\s+(.*)$/i);
  if (!m || !m[1] || !m[1].trim()) return { item: line.trim(), quantity: null, unit: "", note: "" };
  const q = m[1].trim().replace("½", " 1/2").replace("¼", " 1/4").replace("¾", " 3/4").replace("⅓", " 1/3").replace("⅔", " 2/3").replace("⅛", " 1/8");
  let val = 0; for (const part of q.split(/\s+/).filter(Boolean)) { if (part.includes("/")) { const [a, b] = part.split("/").map(Number); if (b) val += a / b; } else val += Number(part) || 0; }
  return { item: m[3].trim(), quantity: val || null, unit: (m[2] || "").toLowerCase(), note: "" };
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]"); if (!el || el.disabled) return;
  const a = el.dataset.action, id = el.dataset.id, v = el.dataset.v;
  if (a === "scrim") { if (e.target === el) { S.sheet = null; S.armed = null; renderSheet(); } return; }
  if (a === "got") return; /* checkbox: handled on change */
  if (!["clear-done","delete","signout","leave"].includes(a)) S.armed = null;
  const s = S.settings;
  switch (a){
    case "go": S.view = v; S.sheet = null; render(); window.scrollTo(0, 0); break;
    case "step": {
      const f = el.dataset.f, d = Number(el.dataset.d);
      if (f === "meals") s.meals = clamp(s.meals + d, 1, 28);
      if (f === "people") s.people = clamp(s.people + d, 1, 16);
      if (f === "favorites") s.favorites = clamp((s.favorites ?? 1) + d, 0, 5);
      persist("settings"); render(); break;
    }
    case "type": { const t = [...s.mealTypes]; const i = t.indexOf(v); if (i >= 0) { if (t.length > 1) t.splice(i, 1); } else t.push(v); s.mealTypes = TYPES.map(x => x[0]).filter(k => t.includes(k)); persist("settings"); render(); break; }
    case "opt": s.options = { ...s.options, [v]: !optOn(v) }; persist("settings"); render(); break;
    case "savekey": {
      const k = document.getElementById("gkey").value.trim(), m = document.getElementById("gmodel").value || "auto";
      lsSet(LS_GEM, k); lsSet(LS_MODEL, m); if (store.mode === "cloud") persist("secrets");
      modelBad = {}; render(); toast(k ? "Gemini key saved." : "Key removed."); if (k) { loadModels(); resumeWrites(); queueWrites(200); } break; }
    case "signin": if (store.fb) signIn(); break;
    case "copyinvite": {
      const link = inviteLink();
      try { await navigator.clipboard.writeText(link); toast("Invite link copied. Send it to your family."); }
      catch { const t = document.createElement("textarea"); t.value = link; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand("copy"); } catch {} t.remove(); toast(ok ? "Invite link copied." : "Copy this link: " + link); }
      break; }
    case "join": joinHousehold(document.getElementById("joincode").value); break;
    case "joinpending": joinHousehold(pendingJoin); break;
    case "dismissjoin": clearJoinParam(); render(); break;
    case "leave": if (S.armed !== "leave") { S.armed = "leave"; render(); break; }
      S.armed = null; leaveHousehold(); break;
    case "signout": if (S.armed !== "signout") { S.armed = "signout"; renderSheet(); break; }
      S.armed = null; S.sheet = null; renderSheet(); await store.fb.A.signOut(store.fb.auth); break;
    case "generate": S.open.settings = false; suggest(initialCount(), { fresh: S.plan.candidates.length > 0, withFavorites: true }); break;
    case "more": suggest(5); break;
    case "pick": {
      const c = S.plan.candidates.find(x => x.id === id); if (!c) break;
      if (c.status === "picked") unpickCandidate(c); else pickCandidate(c);
      render(); break; }
    case "reject": {
      const c = S.plan.candidates.find(x => x.id === id); if (!c) break;
      S.plan.candidates = S.plan.candidates.filter(x => x.id !== id); S.plan.rejected = [...S.plan.rejected, c.name].slice(-200);
      persist("plan"); render(); break; }
    case "settings": openSettings(); break;
    case "buildshop": if (pendingRecipes().length) { toast("Wait for the recipes to finish writing."); break; } await buildShopping(); S.view = "shopping"; render(); window.scrollTo(0, 0); break;
    case "retrywrite": { const r = S.recipes[id]; if (!r) break; if (!gemKey()) { openSettings(); toast(aiErr({ code: "no_key" })); break; }
      r.writeFailed = false; r.pending = true; r.pendingSince = Date.now(); saveRecipe(r); queueWrites(100); render(); break; }
    case "addextras": { const t = document.getElementById("addtxt"); const n = await addExtras(t ? t.value : ""); if (n) { const t2 = document.getElementById("addtxt"); if (t2) t2.value = ""; } break; }
    case "rmx": S.extras = S.extras.filter(x => x.id !== id); persist("extras"); render(); break;
    case "rmphoto": { const i = Number(el.dataset.i); const p = S.sheet.photos[i]; if (p) URL.revokeObjectURL(p.url); S.sheet.photos.splice(i, 1); renderSheet(); break; }
    case "open": S.sheet = { type: "recipe", id, from: S.view }; renderSheet(); break;
    case "close": S.sheet = null; renderSheet(); break;
    case "toggle-done": { const r = S.recipes[id]; if (!r) break; r.done = !r.done; r.doneAt = r.done ? Date.now() : (r.doneAt || null); saveRecipe(r); render();
      if (r.done && !r.rating) toast("Marked as made. Open it to rate it."); break; }
    case "fav": { const r = S.recipes[id]; r.favorite = !r.favorite; saveRecipe(r); render(); break; }
    case "inplan": { const r = S.recipes[id]; r.inPlan = !r.inPlan; if (r.inPlan) { r.done = false; r.addedAt = Date.now(); } saveRecipe(r); syncCandidates(); render();
      const n = weekCount(); toast(r.inPlan ? `Added to this week (${n} of ${s.meals} planned).` + (n > s.meals ? " That's more than your plan size." : "") : "Removed from this week's plan."); break; }
    case "rate": { const r = S.recipes[id]; const n = Number(v); r.rating = r.rating === n ? 0 : n;
      if (r.rating >= 4 && !r.favorite) { r.favorite = true; toast("Saved to favorites."); }
      saveRecipe(r); render(); break; }
    case "delete": if (S.armed !== "del-" + id) { S.armed = "del-" + id; renderSheet(); break; }
      S.armed = null; delete S.recipes[id]; persist("r-" + id); syncCandidates(); S.sheet = null; render(); toast("Recipe deleted."); break;
    case "clear-done": if (S.armed !== "clear") { S.armed = "clear"; render(); break; }
      S.armed = null; planRecipes().filter(r => r.done).forEach(r => { r.inPlan = false; saveRecipe(r); }); syncCandidates(); render(); break;
    case "hidepantry": S.hidePantry = !S.hidePantry; render(); break;
    case "rebuild": await buildShopping(); render(); break;
    case "copy": {
      const rows = shopRows(); if (!rows.length) break;
      const txt = SECTIONS.map(sec => { const its = rows.filter(i => i.section === sec && !i.got && !(S.hidePantry && i.pantry)); return its.length ? sec.toUpperCase() + "\n" + its.map(i => `- ${i.item}${i.quantity ? " (" + i.quantity + ")" : ""}`).join("\n") : ""; }).filter(Boolean).join("\n\n");
      try { await navigator.clipboard.writeText(txt); toast("Shopping list copied."); }
      catch { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand("copy"); } catch {} t.remove(); toast(ok ? "Shopping list copied." : "Couldn't copy the list on this device."); }
      break; }
    case "tab": S.filter.tab = v; render(); break;
    case "cat": S.filter.cat = v; render(); break;
    case "add": S.sheet = { type: "add", draft: newDraft(), photos: [] }; renderSheet(); break;
    case "draft-plan": S.sheet.draft.addToPlan = !S.sheet.draft.addToPlan; renderSheet(); break;
    case "draft-fav": S.sheet.draft.favorite = !S.sheet.draft.favorite; renderSheet(); break;
    case "readphoto": readPhoto(); break;
    case "save-new": {
      const d = S.sheet.draft;
      if (!d.name.trim()) { toast("Give the recipe a name first."); document.getElementById("d-name")?.focus(); break; }
      const r = { id: uid(), name: d.name.trim(), description: "", mealType: d.mealType, category: d.category, cuisine: "", cost: "",
        servings: num(d.servings, s.people) || s.people, prepMinutes: num(d.prepMinutes), cookMinutes: num(d.cookMinutes),
        ingredients: d.ingredients.split("\n").map(x => x.trim()).filter(Boolean).map(parseIngLine),
        steps: d.steps.split("\n").map(x => x.trim()).filter(Boolean), tips: d.tips.trim(),
        source: S.sheet.photos.length ? "photo" : "personal", rating: 0, favorite: !!d.favorite, done: false, inPlan: !!d.addToPlan, addedAt: Date.now(), createdAt: Date.now() };
      saveRecipe(r); S.sheet.photos.forEach(p => URL.revokeObjectURL(p.url)); S.sheet = { type: "recipe", id: r.id, from: S.view }; render(); toast(r.favorite ? "Recipe saved to your favorites." : "Recipe saved to your box."); break; }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.action === "got") {
    const k = t.dataset.k;
    if (k[0] === "m") { const it = S.plan.shopping && S.plan.shopping.items[Number(k.slice(1))]; if (it) { it.got = t.checked; persist("shopping"); } }
    else { const it = S.extras.find(x => "x" + x.id === k); if (it) { it.got = t.checked; persist("extras"); } }
    render(); return;
  }
  if (t.id === "photo" && t.files && t.files.length) {
    const room = 6 - S.sheet.photos.length;
    if (t.files.length > room) toast("Up to 6 photos per recipe.");
    for (const f of [...t.files].slice(0, Math.max(0, room))) S.sheet.photos.push({ file: f, url: URL.createObjectURL(f) });
    renderSheet(); return;
  }
  if (t.tagName === "SELECT" && t.dataset.bind) bind(t);
});
let qT;
document.addEventListener("input", e => {
  const t = e.target; if (!t.dataset.bind) return;
  bind(t);
  if (t.dataset.bind === "filter.q") { clearTimeout(qT); qT = setTimeout(() => { const box = document.getElementById("boxList"); if (box) box.innerHTML = boxList(filteredRecipes()); }, 150); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.sheet) { S.sheet = null; renderSheet(); }
  if (e.key === "Enter" && e.target.id === "req") { e.preventDefault(); e.target.blur(); document.querySelector('[data-action="generate"]')?.click(); }
});
function bind(t){
  const k = t.dataset.bind;
  if (k === "requests") { S.settings.requests = t.value; persist("settings"); }
  else if (k === "filter.q") S.filter.q = t.value;
  else if (k.startsWith("draft.") && S.sheet && S.sheet.draft) S.sheet.draft[k.slice(6)] = t.value;
}
document.addEventListener("toggle", e => {
  if (e.target.id === "fold-settings") S.open.settings = e.target.open;
  if (e.target.id === "fold-conn") S.open.conn = e.target.open;
  if (e.target.id === "fold-house") S.open.house = e.target.open;
}, true);

/* ---------- start ---------- */
async function init(){
  try { loadLocal(); render(); } catch (e) { console.error(e); }
  try {
    const u = await initFirebase();
    if (u) {
      const ok = await withTimeout(connectCloud(u), 15000, "loading meals").catch(e => { fsErr(e, "Couldn't load your saved meals."); return false; });
      if (!ok) { store.mode = "local"; store.user = store.user || null; loadLocal(); }
    }
  } catch (e) { console.error(e); store.fbError = store.fbError || ("Couldn't connect: " + (e && (e.message || e.code))); }
  finally {
    window.__mbLoaded = true;
    S.loaded = true;
    S.view = openMeals().length ? "plan" : "generate";
    syncCandidates(); migrateOnce(); resumeWrites();
    try { render(); } catch (e) { console.error(e); showFatal(e); }
    if (store.fbError) toast(store.fbError);
    loadModels();
  }
}
function showFatal(e){
  const v = document.getElementById("view");
  v.innerHTML = `<div class="empty" style="margin-top:20px"><h3>Something went wrong</h3><p>${esc(String(e && (e.message || e)))}</p><p>Send this message to whoever set up the app.</p></div>`;
}
init();
</script>
